name: CAA stage Stephan-requested Cannes v3 photo for review only

on:
  push:
    branches: [content/caa-2026-11-02-croisette-v1]
    paths: ['.github/workflows/caa-stage-cannes-v3-photo.yml']

permissions:
  contents: write

concurrency:
  group: caa-stage-cannes-v3-photo
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout dedicated editorial branch
        uses: actions/checkout@v4
        with:
          ref: content/caa-2026-11-02-croisette-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Download and validate source photo from Wikimedia Commons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/news
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 130 \
            --user-agent 'CoteDAzurAgencyEditorialAssets/1.0 (Commons CC BY 3.0 attribution)' \
            'https://upload.wikimedia.org/wikipedia/commons/a/af/Cannes_drone_shot_in_2024.png' -o /tmp/cannes-drone-original.png
          test "$(file -b --mime-type /tmp/cannes-drone-original.png)" = 'image/png'
          test "$(wc -c < /tmp/cannes-drone-original.png)" -eq 7384979
          echo '489d2d54d489fedc5094f66f0a162f162ed6f087  /tmp/cannes-drone-original.png' | sha1sum -c --status
      - name: Decode and optimize without changing editorial image-frame dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/caa-cannes-image-venv
          /tmp/caa-cannes-image-venv/bin/pip install --quiet 'Pillow==11.3.0'
          /tmp/caa-cannes-image-venv/bin/python - <<'PY'
          from PIL import Image, ImageOps
          import hashlib, os
          source='/tmp/cannes-drone-original.png'
          target='public/news/2026-11-02-cannes-croisette.jpg'
          im=Image.open(source)
          im.load()
          assert im.format=='PNG' and im.size==(3840,2160), f'Unexpected source {im.format} {im.size}'
          assert im.mode in ('RGB','RGBA','P')
          im=ImageOps.exif_transpose(im).convert('RGB')
          im.thumbnail((1600,900),Image.Resampling.LANCZOS)
          assert im.size==(1600,900), im.size
          im.save(target, format='JPEG', quality=88, optimize=True, progressive=True, subsampling=0)
          out=Image.open(target);out.load()
          assert out.format=='JPEG' and out.size==(1600,900)
          with open(target,'rb') as f: buf=f.read()
          assert buf[:2]==bytes.fromhex('ffd8') and buf[-2:]==bytes.fromhex('ffd9')
          print(f'Cannes photo: JPEG dimensions={out.size} bytes={len(buf)} sha256={hashlib.sha256(buf).hexdigest()}')
          PY
      - name: Change ONLY the image credit in the already-approved draft article
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs');
          const p='content/news/2026-11-02-cannes-croisette-transformation.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if (j.image!=='/news/2026-11-02-cannes-croisette.jpg' || j.imageCredit?.author!=='Gilbert Bochenek') throw Error('Unexpected article content; stop');
          j.imageCredit={author:'Joeys Journeys',sourceUrl:'https://commons.wikimedia.org/wiki/File:Cannes_drone_shot_in_2024.png',license:'CC BY 3.0',licenseUrl:'https://creativecommons.org/licenses/by/3.0/'};
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          JS
      - name: Remove temporary workflow and commit on the review branch ONLY
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/caa-stage-cannes-v3-photo.yml
          git add public/news/2026-11-02-cannes-croisette.jpg content/news/2026-11-02-cannes-croisette-transformation.json
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'assets(news): stage verified 2024 Cannes sunset panorama for Stephan v3 review'
          git push origin HEAD:content/caa-2026-11-02-croisette-v1
