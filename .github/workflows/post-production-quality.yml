name: Post-production quality gate
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Production URL
        required: false
permissions:
  contents: read
  deployments: read
concurrency:
  group: post-production-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify live production (desktop and mobile)
        env:
          SITE_URL: ${{ inputs.url || 'https://www.cotedazuragency.com' }}
        run: node scripts/check-production.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-quality-evidence
          path: artifacts/post-production/
          retention-days: 30
