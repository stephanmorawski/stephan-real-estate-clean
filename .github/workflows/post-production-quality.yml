name: Post-production quality gate

on:
  push:
    branches: [main]
    paths:
      - 'content/news/**'
      - 'public/news/**'
      - 'public/partners/**'
      - 'src/**'
      - 'scripts/check-production.mjs'
      - 'scripts/check-property-cards.mjs'
      - 'scripts/serve-qa-property-fixture.mjs'
      - 'scripts/generate-news-index.mjs'
      - '.github/workflows/post-production-quality.yml'
      - 'middleware.js'
      - 'next.config.*'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/post-production-quality.yml'
      - 'scripts/check-production.mjs'
      - 'scripts/check-property-cards.mjs'
      - 'scripts/serve-qa-property-fixture.mjs'
      - 'src/components/Header.js'
      - 'src/app/[lang]/vente/**'
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Production URL
        required: false
        default: https://www.cotedazuragency.com
      expected_sha:
        description: Expected deployed Git commit SHA
        required: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: post-production-${{ github.event.pull_request.number || github.event.deployment.id || github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       (contains(github.event.deployment_status.target_url, 'stephan-real-estate-hcoz') ||
        contains(github.event.deployment_status.environment_url, 'cotedazuragency.com')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the verifier and matching content
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.event.deployment.sha || github.sha }}
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project and browser dependencies
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      # PR checks use public catalogue fixtures, not production credentials.
      # They do not certify production: push/deployment checks below use the real domain.
      - name: Build and serve the PR for isolated layout tests
        if: github.event_name == 'pull_request'
        env:
          APIMO_BASE_URL: http://127.0.0.1:4174
          APIMO_PROVIDER_CODE: qa
          APIMO_API_KEY: qa-placeholder-not-a-secret
          APIMO_AGENCY_CODE: qa
          VERCEL_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node scripts/serve-qa-property-fixture.mjs > /tmp/caa-fixture.log 2>&1 &
          fixture_ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/agencies/qa/properties > /dev/null; then fixture_ready=1; break; fi
            sleep 2
          done
          if [ "$fixture_ready" != 1 ]; then cat /tmp/caa-fixture.log; exit 1; fi
          npm run build
          npm run start -- --hostname 127.0.0.1 --port 4173 > /tmp/caa-next.log 2>&1 &
          app_ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/api/version > /dev/null; then app_ready=1; break; fi
            sleep 2
          done
          if [ "$app_ready" != 1 ]; then cat /tmp/caa-next.log; exit 1; fi
      - name: Verify the live production deployment
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ inputs.url || 'https://www.cotedazuragency.com' }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.deployment.sha || github.sha }}
        run: node scripts/check-production.mjs
      - name: Verify all property prices across responsive layouts
        if: ${{ !cancelled() }}
        env:
          SITE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || inputs.url || 'https://www.cotedazuragency.com' }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.event.deployment.sha || github.sha }}
        run: node scripts/check-property-cards.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-quality-evidence-${{ github.run_id }}
          path: artifacts/post-production/
          retention-days: 30
          if-no-files-found: warn
