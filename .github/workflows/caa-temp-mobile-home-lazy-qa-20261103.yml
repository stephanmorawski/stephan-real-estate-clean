name: CAA isolated validate mobile lazy-image QA against production
on:
  push:
    branches: [fix/caa-mobile-home-lazy-image-qa-20261103]
    paths:
      - '.github/workflows/caa-temp-mobile-home-lazy-qa-20261103.yml'
      - 'scripts/check-production.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify syntax and browser dependencies
        run: |
          node --check scripts/check-production.mjs
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual live site with real image decodes in mobile and desktop
        env:
          SITE_URL: https://www.cotedazuragency.com
          EXPECTED_SHA: e4d396ad7c34e05dec5533951a1a7210586939fb
        run: node scripts/check-production.mjs
      - name: Save full page screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caa-mobile-home-lazy-qa-evidence
          path: artifacts/post-production/
          retention-days: 14
          if-no-files-found: warn
