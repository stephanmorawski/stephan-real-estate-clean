name: CAA Nov 11 Garoupe FR EN preview QA (review only)
on:
  push:
    branches: [caa/editorial-2026-11-11-choice-2]
    paths:
      - '.github/workflows/caa-2026-11-11-garoupe-preview-check.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application and browser
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Build and start exact branch
        run: |
          npm run build
          (npm start -- -p 3000 >/tmp/caa-garoupe-preview.log 2>&1 &)
          for i in $(seq 1 55); do
            if curl -fsS http://127.0.0.1:3000/fr/actualites >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/caa-garoupe-preview.log
          exit 1
      - name: Validate FR EN rendered SEO links license image and responsive layout
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const slug='2026-11-11-antibes-garoupe-plage-publique';
          const record=JSON.parse(fs.readFileSync('content/news-drafts/2026-11-11-editorial-proposals.json','utf8'));
          const story=JSON.parse(fs.readFileSync('content/news/'+slug+'.json','utf8'));
          const v=record.selectedArticle.visual;
          const imageUrl='/news/2026-11-11-antibes-garoupe-abxbay.jpg';
          const imagePath='public'+imageUrl;
          const bytes=fs.readFileSync(imagePath);
          const sha=crypto.createHash('sha256').update(bytes).digest('hex');
          const failures=[],pages=[];
          const dir='artifacts/caa-2026-11-11-preview';
          fs.mkdirSync(dir,{recursive:true});
          if(record.version!==2||record.selectedChoice!==2||record.workflowStatus!=='preparing'||record.publicationAuthorized!==false)failures.push('bad registry state');
          if(!v.decodedWithPillow||v.status!=='materialized_verified'||v.assetWidth!==720||v.assetHeight!==960||v.assetMime!=='image/jpeg')failures.push('unverified image metadata');
          if(sha!==v.assetSha256||bytes.length!==v.assetBytes||bytes[0]!==255||bytes[1]!==216||bytes.at(-2)!==255||bytes.at(-1)!==217)failures.push('image byte identity failed');
          if(story.imageCredit.author!=='Abxbay'||story.imageCredit.license!=='CC BY-SA 4.0')failures.push('license credit missing');
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:3000';
          for(const [device,viewport] of Object.entries({desktop:{width:1440,height:900},mobile:{width:390,height:844}})){
            for(const lang of ['fr','en']){
              for(const type of ['index','article']){
                const url='/'+lang+'/actualites'+(type==='article'?'/'+slug:'');
                const page=await browser.newPage({viewport,deviceScaleFactor:1});
                const errors=[],bad=[];
                page.on('pageerror',err=>errors.push(err.message));
                page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text());});
                page.on('response',res=>{if(res.url().startsWith(base)&&res.status()>=400&&['document','image','script','stylesheet'].includes(res.request().resourceType()))bad.push(res.status()+' '+res.url())});
                const key=lang+'-'+type+'-'+device;
                try{
                  const res=await page.goto(base+url,{waitUntil:'domcontentloaded',timeout:35000});
                  await page.waitForLoadState('load',{timeout:15000}).catch(()=>{});
                  await page.evaluate(async()=>{await Promise.all([...document.images].map(i=>i.decode().catch(()=>null)))});
                  const data=await page.evaluate(({imageUrl,slug})=>{
                    const body=document.body.innerText;
                    const imgs=[...document.images].filter(i=>(i.getAttribute('src')||'').includes(imageUrl));
                    const img=imgs[0];
                    const m={title:document.title,description:document.querySelector('meta[name="description"]')?.content,canonical:document.querySelector('link[rel="canonical"]')?.href,ogImage:document.querySelector('meta[property="og:image"]')?.content,ogWidth:document.querySelector('meta[property="og:image:width"]')?.content,ogHeight:document.querySelector('meta[property="og:image:height"]')?.content};
                    const rect=img?.getBoundingClientRect(),crop=rect&&img?.naturalHeight?Math.abs(rect.width/rect.height-img.naturalWidth/img.naturalHeight)/(img.naturalWidth/img.naturalHeight):null;
                    const cardWidths=[...document.querySelectorAll('article.card-luxe')].map(a=>a.querySelector('.grid > div:first-child')?.getBoundingClientRect().width).filter(Boolean);
                    return {lang:document.documentElement.lang,h1:document.querySelector('h1')?.innerText,overflow:document.documentElement.scrollWidth-innerWidth,metadata:m,photo:imgs.map(i=>({complete:i.complete,w:i.naturalWidth,h:i.naturalHeight,fit:getComputedStyle(i).objectFit})),cropRatio:crop,
                      credit:body.includes('Abxbay')&&body.includes('CC BY-SA 4.0')&&body.includes('2023'),source:document.body.innerHTML.includes('antibes-juanlespins.com/information/actualites/la-garoupe'),link:[...document.querySelectorAll('a[href]')].some(a=>a.getAttribute('href')?.endsWith(slug)),cardWidths};
                  },{imageUrl,slug});
                  await page.screenshot({path:dir+'/'+key+'.png',fullPage:true,timeout:30000});
                  pages.push({url,device,status:res?.status(),...data,errors,bad});
                  if(res?.status()!==200||data.lang!==lang||!data.metadata.description||!data.metadata.canonical)failures.push(key+' metadata/HTTP/lang');
                  if(data.overflow>3)failures.push(key+' horizontal overflow '+data.overflow);
                  if(errors.length||bad.length)failures.push(key+' console/network errors '+JSON.stringify({errors,bad}));
                  if(type==='article'){
                    if(!data.photo.length||data.photo.some(p=>!p.complete||p.w!==720||p.h!==960))failures.push(key+' image missing/bad decode');
                    if(data.cropRatio!==null&&data.cropRatio>.03)failures.push(key+' cropped hero');
                    if(!data.credit||!data.source)failures.push(key+' credits or sources absent');
                    if(!data.h1?.includes('Garoupe'))failures.push(key+' headline mismatch');
                    if(!data.metadata.ogImage?.includes(imageUrl)||data.metadata.ogWidth!=='720'||data.metadata.ogHeight!=='960')failures.push(key+' OG dimensions mismatch');
                  }else{
                    if(!data.link)failures.push(key+' article absent from index');
                    if(device==='desktop'&&data.cardWidths.some(w=>Math.abs(w-320)>3))failures.push(key+' misaligned index cards');
                  }
                }catch(e){failures.push(key+' '+e.message)}
                finally{await page.close()}
              }
            }
          }
          await browser.close();
          const report={cycleId:record.cycleId,sha:process.env.GITHUB_SHA,photo:{bytes:bytes.length,sha256:sha,width:720,height:960},pages,failures};
          fs.writeFileSync(dir+'/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({sha:report.sha,photo:report.photo,pages:pages.map(p=>({url:p.url,device:p.device,status:p.status,photo:p.photo,overflow:p.overflow,errors:p.errors,bad:p.bad})),failures},null,2));
          if(failures.length)process.exitCode=1;
          JS
      - name: Save screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caa-2026-11-11-garoupe-preview-qa
          path: artifacts/caa-2026-11-11-preview/
          retention-days: 14
          if-no-files-found: warn
