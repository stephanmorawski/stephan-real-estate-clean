name: Publish news to production

on:
  push:
    branches:
      - main
    paths:
      - 'content/news/**'
      - 'public/news/**'
      - 'public/partners/**'
      - 'src/lib/news/**'
      - 'src/app/[lang]/actualites/**'
      - 'scripts/generate-news-index.mjs'
      - 'keystatic.config.js'
      - 'middleware.js'
      - 'src/app/layout.js'
      - 'src/app/[lang]/layout.js'
      - 'src/app/[lang]/[seoSlug]/**'
      - 'src/components/SeoLandingPage.jsx'
      - 'src/lib/seo-pages.js'
      - 'src/lib/seo.js'
      - 'src/app/sitemap.ts'
      - '.github/workflows/publish-news.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coteazuragency-news-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        env:
          # Keystatic validates that these variables exist while Next.js collects
          # the API route during build. CI never uses them to access GitHub.
          KEYSTATIC_GITHUB_CLIENT_ID: ci-build
          KEYSTATIC_GITHUB_CLIENT_SECRET: ci-build-placeholder
          KEYSTATIC_SECRET: ci-build-placeholder-32-characters
        run: npm run build

      - name: Require Vercel deploy hook
        env:
          VERCEL_PRODUCTION_DEPLOY_HOOK: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_PRODUCTION_DEPLOY_HOOK" ]; then
            echo "Missing GitHub secret: VERCEL_PRODUCTION_DEPLOY_HOOK"
            exit 1
          fi

      - name: Trigger Vercel production deployment
        env:
          VERCEL_PRODUCTION_DEPLOY_HOOK: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error --request POST "$VERCEL_PRODUCTION_DEPLOY_HOOK"
          echo

      - name: Identify changed news articles
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'content/news/*.json' > /tmp/news-files.txt
          else
            git diff-tree --no-commit-id --name-only -r HEAD -- 'content/news/*.json' > /tmp/news-files.txt
          fi
          cat /tmp/news-files.txt

      - name: Verify production
        shell: bash
        run: |
          # Always verify that both news indexes respond after deployment.
          for index_url in \
            "https://www.cotedazuragency.com/fr/actualites" \
            "https://www.cotedazuragency.com/en/actualites"; do
            success=0
            for attempt in $(seq 1 30); do
              code=$(curl --silent --location --output /dev/null --write-out '%{http_code}' "$index_url" || true)
              if [ "$code" = "200" ]; then
                success=1
                break
              fi
              echo "Waiting for $index_url ($attempt/30, HTTP $code)"
              sleep 10
            done
            if [ "$success" -ne 1 ]; then
              echo "Production index verification failed: $index_url"
              exit 1
            fi
          done

          # If an article JSON changed, additionally verify the exact FR/EN pages
          # expose the approved publication date. Routes are derived from JSON
          # filenames by scripts/generate-news-index.mjs, not from entry.slug.
          if [ ! -s /tmp/news-files.txt ]; then
            echo "No changed article JSON; index verification is sufficient."
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            slug=$(basename "$file" .json)
            publishedAt=$(node -e "const a=require('./$file'); process.stdout.write(a.publishedAt)")
            partnerUrl=$(node -e "const a=require('./$file'); process.stdout.write(a.partnerUrl || '')")
            partnerLogo=$(node -e "const a=require('./$file'); process.stdout.write(a.partnerLogo || '')")

            for lang in fr en; do
              url="https://www.cotedazuragency.com/$lang/actualites/$slug"
              echo "Verifying $url"
              success=0
              for attempt in $(seq 1 30); do
                body=$(curl --silent --show-error --location "$url" || true)
                if printf '%s' "$body" | grep -Fq "$publishedAt"; then
                  if [ -n "$partnerUrl" ] && ! printf '%s' "$body" | grep -Fq "$partnerUrl"; then
                    echo "Partner URL not present yet"
                  elif [ -n "$partnerLogo" ] && ! printf '%s' "$body" | grep -Fq "$partnerLogo"; then
                    echo "Partner logo not present yet"
                  else
                    echo "Verified: $url"
                    success=1
                    break
                  fi
                fi
                echo "Attempt $attempt/30 not ready yet"
                sleep 10
              done
              if [ "$success" -ne 1 ]; then
                echo "Production article verification failed for $url"
                exit 1
              fi
            done
          done < /tmp/news-files.txt
