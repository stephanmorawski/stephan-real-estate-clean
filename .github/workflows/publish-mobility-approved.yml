name: Publish approved mobility article

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mobility-approved.yml'

permissions:
  contents: write

concurrency:
  group: publish-mobility-approved
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize approved JPEG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check Pillow
          curl --fail --location --retry 3 --retry-delay 2 --max-time 90 \
            'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d4ec-8210-9c56-67c02bedadf7/raw?se=2026-10-07T05%3A57%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=8034c96a-c971-50fe-bb5e-470b5eac8fb4&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T05%3A18%3A20Z&ske=2026-10-08T05%3A18%3A20Z&sks=b&skv=2026-02-06&sig=dpkbFu4yTxUFaAc4HJ9AdSMsIH2XfYdY57edJE%2BmjWg%3D' \
            -o /tmp/approved.png
          mkdir -p public/news
          python - <<'PY'
          from PIL import Image
          import hashlib
          src='/tmp/approved.png'
          dst='public/news/2026-10-06-mobilite-cote-azur-sans-voiture.jpg'
          with Image.open(src) as im:
              im.convert('RGB').save(dst, 'JPEG', quality=92, optimize=True, progressive=False)
          with Image.open(dst) as im:
              assert im.format == 'JPEG'
              assert im.size == (1122, 1402)
              im.verify()
          data=open(dst,'rb').read()
          sha=hashlib.sha256(data).hexdigest()
          assert sha == 'f510976617c36441d2a8b26113724c05e09842bca1df7b2324e2e8b99332d53e', sha
          assert len(data) == 508908
          print('Validated JPEG', len(data), sha)
          PY

      - name: Publish exact staged article
        shell: bash
        run: |
          set -euo pipefail
          cp .caa-staging/2026-10-06-mobilite-cote-azur-sans-voiture.json content/news/2026-10-06-mobilite-cote-azur-sans-voiture.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('content/news/2026-10-06-mobilite-cote-azur-sans-voiture.json')
          a=json.loads(p.read_text())
          assert a['slug']=='2026-10-06-mobilite-cote-azur-sans-voiture'
          assert a['status']=='published'
          assert a['image']=='/news/2026-10-06-mobilite-cote-azur-sans-voiture.jpg'
          assert a['fr']['title']=='Se déplacer sur la Côte d’Azur sans dépendre uniquement de la voiture'
          assert a['en']['title']=='Getting around the French Riviera without relying solely on a car'
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate production build
        env:
          KEYSTATIC_GITHUB_CLIENT_ID: ci-build
          KEYSTATIC_GITHUB_CLIENT_SECRET: ci-build-placeholder
          KEYSTATIC_SECRET: ci-build-placeholder-32-characters
        run: |
          npm ci
          npm run build

      - name: Commit validated publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/news/2026-10-06-mobilite-cote-azur-sans-voiture.jpg content/news/2026-10-06-mobilite-cote-azur-sans-voiture.json
          if git diff --cached --quiet; then
            echo 'Publication already materialized.'
          else
            git commit -m 'news: publish approved mobility article and JPEG'
            git push origin HEAD:main
          fi
