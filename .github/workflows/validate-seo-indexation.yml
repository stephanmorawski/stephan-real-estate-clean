name: Validate SEO indexing patch

on:
  push:
    branches:
      - seo-indexation-fix-2026-09-17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        env:
          KEYSTATIC_GITHUB_CLIENT_ID: ci-build
          KEYSTATIC_GITHUB_CLIENT_SECRET: ci-build-placeholder
          KEYSTATIC_SECRET: ci-build-placeholder-32-characters
        run: npm run build
