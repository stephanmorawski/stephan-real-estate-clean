name: CAA Garoupe selected photo FR EN QA review only
on:
  push:
    branches: [caa/editorial-2026-11-11-choice-2]
    paths:
      - .github/workflows/caa-garoupe-selected-photo-qa-20261112.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and launch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
          npm run build
          (npm start -- -p 3000 >/tmp/caa-garoupe-preview.log 2>&1 &)
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:3000/fr/actualites >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/caa-garoupe-preview.log
          exit 1
      - name: Verify complete image, credits and eight responsive pages
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const slug='2026-11-11-antibes-garoupe-plage-publique';
          const imageUrl='/news/2026-11-11-antibes-garoupe-stephan-requested.png';
          const photo=fs.readFileSync('public'+imageUrl);
          const photoSha=crypto.createHash('sha256').update(photo).digest('hex');
          const photoWidth=photo.readUInt32BE(16),photoHeight=photo.readUInt32BE(20);
          const story=JSON.parse(fs.readFileSync('content/news/'+slug+'.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('content/news-drafts/2026-11-11-editorial-proposals.json','utf8'));
          const fail=[],results=[];
          if(photoSha!=='bba8199425fc31df7110d39fbe3a8df70c691cb44363c7dc073d127bc09cdf8e'||photo.length!==2359996||photoWidth!==1360||photoHeight!==811)fail.push('image integrity/size/dimensions');
          if(photo.subarray(0,8).toString('hex')!=='89504e470d0a1a0a')fail.push('PNG signature');
          if(story.image!==imageUrl||story.imageLayout!=='contain'||story.imageWidth!==1360||story.imageHeight!==811)fail.push('image metadata');
          if(!story.imageCredit.license.includes('confirmer')||registry.publicationAuthorized!==false||!['revision_requested','preparing'].includes(registry.workflowStatus))fail.push('rights/approval safety');
          fs.mkdirSync('artifacts/caa-garoupe-photo-v3',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:3000';
          for(const [device,viewport] of Object.entries({desktop:{width:1440,height:900},mobile:{width:390,height:844}})){
            for(const lang of ['fr','en']){
              for(const type of ['index','article']){
                const key=lang+'-'+type+'-'+device;
                const p=await browser.newPage({viewport,deviceScaleFactor:1});
                const errors=[],network=[];
                p.on('pageerror',e=>errors.push(e.message));
                p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
                p.on('response',r=>{if(r.url().startsWith(base)&&r.status()>=400&&['document','image','script','stylesheet'].includes(r.request().resourceType()))network.push(r.status()+' '+r.url())});
                const pathname='/'+lang+'/actualites'+(type==='article'?'/'+slug:'');
                try{
                  const response=await p.goto(base+pathname,{waitUntil:'domcontentloaded',timeout:40000});
                  await p.waitForLoadState('load',{timeout:15000}).catch(()=>{});
                  await p.evaluate(async()=>Promise.all([...document.images].map(x=>x.decode().catch(()=>null))));
                  const v=await p.evaluate(({imageUrl,slug})=>{
                    const candidates=[...document.images].filter(x=>(x.getAttribute('src')||'').includes(imageUrl));
                    const im=candidates[0],rect=im?.getBoundingClientRect();
                    const ratio=rect?.height&&im?.naturalHeight?Math.abs(rect.width/rect.height-im.naturalWidth/im.naturalHeight)/(im.naturalWidth/im.naturalHeight):null;
                    const body=document.body.innerText;
                    return {language:document.documentElement.lang,h1:document.querySelector('h1')?.innerText,title:document.title,
                      description:document.querySelector('meta[name="description"]')?.content,canonical:document.querySelector('link[rel="canonical"]')?.href,
                      ogImage:document.querySelector('meta[property="og:image"]')?.content,
                      overflow:document.documentElement.scrollWidth-innerWidth,
                      photo:candidates.map(x=>({complete:x.complete,width:x.naturalWidth,height:x.naturalHeight,fit:getComputedStyle(x).objectFit})),
                      cropRatio:ratio,credit:body.includes('confirmer')&&body.includes('La Garoupe'),
                      source:document.body.innerHTML.includes('antibes-juanlespins.com'),
                      articleLink:[...document.querySelectorAll('a[href]')].some(a=>(a.getAttribute('href')||'').endsWith(slug))};
                  },{imageUrl,slug});
                  results.push({key,http:response?.status(),...v,errors,network});
                  if(response?.status()!==200||v.language!==lang||!v.description||!v.canonical)fail.push(key+' metadata/http/lang');
                  if(v.overflow>3)fail.push(key+' overflow '+v.overflow);
                  if(errors.length||network.length)fail.push(key+' console/network error');
                  if(type==='article'){
                    if(!v.photo.length||v.photo.some(im=>!im.complete||im.width!==1360||im.height!==811||im.fit!=='contain'))fail.push(key+' image load/dimensions/fit');
                    if(v.cropRatio!=null&&v.cropRatio>.035)fail.push(key+' image cropped');
                    if(!v.credit||!v.source||!v.h1?.includes('Garoupe')||!v.ogImage?.includes(imageUrl))fail.push(key+' text/source/og');
                  }else if(!v.articleLink)fail.push(key+' article absent from index');
                  await p.screenshot({path:'artifacts/caa-garoupe-photo-v3/'+key+'.png',fullPage:true,timeout:30000});
                }catch(e){fail.push(key+': '+e.message)}
                finally{await p.close()}
              }
            }
          }
          await browser.close();
          const report={sha:process.env.GITHUB_SHA,photo:{size:photo.length,width:photoWidth,height:photoHeight,sha256:photoSha},results,failures:fail};
          fs.writeFileSync('artifacts/caa-garoupe-photo-v3/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({sha:report.sha,photo:report.photo,tests:results.length,failures:fail},null,2));
          if(fail.length)process.exitCode=1;
          JS
      - name: Attach QA report and desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caa-garoupe-photo-v3-qa
          path: artifacts/caa-garoupe-photo-v3/
          retention-days: 14
          if-no-files-found: warn
