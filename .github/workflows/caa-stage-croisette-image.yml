name: Stage Croisette editorial image on review branch

on:
  push:
    branches:
      - content/caa-2026-11-02-croisette-v1
    paths:
      - '.github/workflows/caa-stage-croisette-image.yml'

permissions:
  contents: write

concurrency:
  group: caa-croisette-stage-image-v1
  cancel-in-progress: false

jobs:
  materialize-licensed-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v4
        with:
          ref: content/caa-2026-11-02-croisette-v1
          fetch-depth: 0
      - name: Download and verify CC0 original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/caa-stage public/news
          curl --fail --location --retry 1 --retry-delay 3 --connect-timeout 15 --max-time 150 \
            --user-agent 'CoteDAzurAgencyEditorial/1.0 (https://www.cotedazuragency.com)' \
            'https://upload.wikimedia.org/wikipedia/commons/b/bc/Promenade_de_La_Croisette_aux_environs_du_Square_de_Verdun_%28Cannes%29_en_avril_2023.JPG' \
            --output /tmp/caa-stage/croisette_original.jpg
          echo '1bdb1414ebbfa3144a8bf57a70ed351add6fc474  /tmp/caa-stage/croisette_original.jpg' | sha1sum --check --status
          test "$(file --brief --mime-type /tmp/caa-stage/croisette_original.jpg)" = image/jpeg
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          import hashlib, json, pathlib, mimetypes
          from datetime import datetime, timezone
          src=pathlib.Path('/tmp/caa-stage/croisette_original.jpg')
          dst=pathlib.Path('public/news/2026-11-02-cannes-croisette.jpg')
          with Image.open(src) as im:
              im.load()
              print('original dimensions',im.size,'format',im.format)
              if im.format not in ('JPEG','MPO') or min(im.size) < 1200: raise ValueError('unexpected original image')
              out=ImageOps.exif_transpose(im).convert('RGB')
              out.thumbnail((1600,1200), Image.Resampling.LANCZOS)
              if min(out.size) < 800: raise ValueError('unexpected resized dimensions')
              out.save(dst,format='JPEG',quality=87,optimize=True,progressive=True)
          with Image.open(dst) as checked:
              checked.verify()
          data=dst.read_bytes()
          if not (90000 <= len(data) <= 1600000): raise ValueError('image bytes outside range')
          sha=hashlib.sha256(data).hexdigest()
          reg=pathlib.Path('content/news-drafts/2026-11-02-replacement-proposals.json')
          obj=json.loads(reg.read_text(encoding='utf8'))
          if obj.get('cycleId')!='caa-2026-11-02-replacement' or obj.get('selectedChoice')!=1 or obj.get('workflowStatus')!='preparing':
              raise ValueError('unexpected registry state, not modifying')
          obj['imageCandidate'].update({'integrityState':'verified','finalMime':'image/jpeg','finalDimensions':list(out.size),'finalBytes':len(data),'finalSha256':sha,'decoded':True})
          obj['editorialReview']['imagesPrepared']=True
          obj['stateRevision']=obj.get('stateRevision',2)+1
          reg.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          print('image validation:', {'mime':'image/jpeg','size':len(data),'sha256':sha,'width':out.width,'height':out.height})
          PY
      - name: Commit verified image and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/caa-stage-croisette-image.yml'
          git add public/news/2026-11-02-cannes-croisette.jpg content/news-drafts/2026-11-02-replacement-proposals.json
          git commit -m 'assets(news): add verified CC0 Croisette photograph for editorial preview'
          git push origin HEAD:content/caa-2026-11-02-croisette-v1
