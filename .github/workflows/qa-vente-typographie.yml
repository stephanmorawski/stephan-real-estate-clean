name: Contrôle des titres des mandats en production
on:
  push:
    branches: [qa/vente-typographie-20261124]
    paths: [scripts/qa-vente-typographie.mjs, .github/workflows/qa-vente-typographie.yml]
permissions:
  contents: read
jobs:
  mandats:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Vérifier Chrome et ChromeDriver fournis par le runner
        run: |
          google-chrome --version
          chromedriver --version
      - name: Mesurer les titres des fiches et du catalogue public en FR et EN
        env:
          EXPECTED_SHA: 'f87f3c6931beeb11ded55370d18a73c97f3736a8'
        run: node scripts/qa-vente-typographie.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vente-typographie
          path: artifacts/vente-typographie/
          retention-days: 30
