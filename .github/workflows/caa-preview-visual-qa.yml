name: CAA Croisette preview visual QA (temporary)
on:
  push:
    branches:
      - content/caa-2026-11-02-croisette-v1
    paths:
      - '.github/workflows/caa-preview-visual-qa.yml'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build and start exact branch commit locally
        run: |
          npm run build
          (npm start -- -p 3000 > /tmp/caa-preview.log 2>&1 &)
          for n in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/fr/actualites >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/caa-preview.log
          exit 1
      - name: Verify French and English desktop/mobile pages, image and screenshots
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const base='http://127.0.0.1:3000';
          const slug='2026-11-02-cannes-croisette-transformation';
          const image='/news/2026-11-02-cannes-croisette.jpg';
          const expectedHash='11aa7e1a87be7141bc515cf167eed77bd920d6c7e06b2a1a8896033bb4ad0728';
          const routes=['/fr/actualites','/en/actualites','/fr/actualites/'+slug,'/en/actualites/'+slug];
          const fails=[]; const pages=[]; const root='artifacts/caa-preview'; fs.mkdirSync(root,{recursive:true});
          const imageResponse=await fetch(base+image); const buf=Buffer.from(await imageResponse.arrayBuffer());
          const imageMeta={status:imageResponse.status,type:imageResponse.headers.get('content-type'),bytes:buf.length,sha256:crypto.createHash('sha256').update(buf).digest('hex')};
          if(imageMeta.status!==200||!imageMeta.type?.startsWith('image/jpeg')||imageMeta.sha256!==expectedHash||imageMeta.bytes!==620962) fails.push('image integrity mismatch '+JSON.stringify(imageMeta));
          const browser=await chromium.launch({headless:true});
          for(const [device,viewport] of Object.entries({desktop:{width:1440,height:900},mobile:{width:390,height:844}})){
            for(const route of routes){
              const ctx=await browser.newContext({viewport,deviceScaleFactor:1});const page=await ctx.newPage(); const errors=[];const bad=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('response',r=>{if(r.url().startsWith(base)&&r.status()>=400)bad.push(r.status()+' '+r.url())});
              try{
                const res=await page.goto(base+route,{waitUntil:'networkidle',timeout:60000});
                await page.evaluate(async()=>{for(const i of document.images)await i.decode().catch(()=>{});});
                const data=await page.evaluate(({image})=>{
                  const target=[...document.images].filter(i=>i.getAttribute('src')?.includes(image));
                  const cards=[...document.querySelectorAll('article.card-luxe')].map(x=>({w:x.querySelector('.grid > div:first-child')?.getBoundingClientRect().width,src:x.querySelector('img')?.getAttribute('src')||''}));
                  return {title:document.title,overflow:document.documentElement.scrollWidth-innerWidth,images:target.map(i=>({src:i.src,complete:i.complete,naturalW:i.naturalWidth,naturalH:i.naturalHeight,fit:getComputedStyle(i).objectFit,renderW:i.getBoundingClientRect().width,renderH:i.getBoundingClientRect().height})),cards,hasCredit:document.body.innerText.includes('Benoît Prieur'),hasSource:document.body.innerHTML.includes('la-croisette-les-travaux-de-surface'),h1:document.querySelector('h1')?.innerText,meta:document.querySelector('meta[name=description]')?.content,canonical:document.querySelector('link[rel=canonical]')?.href};
                },{image});
                const key=route.replaceAll('/','_')+'_'+device;
                await page.screenshot({path:root+'/'+key+'.png',fullPage:true});
                pages.push({route,device,http:res?.status(),...data,errors,bad});
                if(res?.status()!==200)fails.push(key+': HTTP '+res?.status());
                if(data.overflow>3)fails.push(key+': horizontal overflow '+data.overflow);
                if(!data.images.length||data.images.some(i=>!i.complete||!i.naturalW||!i.naturalH||i.fit!=='cover'))fails.push(key+': photo missing, undecoded or uncovered');
                if(!data.meta||!data.canonical||(route.endsWith(slug)&&!data.hasSource))fails.push(key+': SEO/source missing');
                if(route.endsWith(slug)&&!data.hasCredit)fails.push(key+': image credit missing');
                if(device==='desktop'&&route.endsWith('/actualites')&&data.cards.some(c=>c.w&&Math.abs(c.w-320)>3))fails.push(key+': news cards inconsistent width');
                if(errors.length||bad.length)fails.push(key+': JS/network error '+JSON.stringify({errors,bad}));
              }catch(e){fails.push(key+': '+e.message);}
              finally{await ctx.close()}
            }
          }
          await browser.close();
          const report={sha:process.env.GITHUB_SHA,previewValidatedLocally:true,imageMeta,pages,failures:fails};
          fs.writeFileSync(root+'/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({sha:report.sha,imageMeta,pages:pages.map(x=>({route:x.route,device:x.device,http:x.http,h1:x.h1,images:x.images.length,overflow:x.overflow,errors:x.errors.length,bad:x.bad.length})),failures:fails},null,2));
          if(fails.length)process.exitCode=1;
          JS
      - name: Upload screenshot and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caa-croisette-preview-qa
          path: artifacts/caa-preview/
          retention-days: 7
          if-no-files-found: warn
