name: Commercial journey checks
on:
  pull_request:
  push:
    branches: ['commercial/**']
permissions:
  contents: read
concurrency:
  group: commercial-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      KEYSTATIC_GITHUB_CLIENT_ID: ci-build
      KEYSTATIC_GITHUB_CLIENT_SECRET: ci-build-placeholder
      KEYSTATIC_SECRET: ci-build-placeholder-32-characters
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run build
      - name: Install isolated browser test tooling without changing project dependencies
        run: |
          npm install --prefix /tmp/commercial-browser --no-save --ignore-scripts --no-fund --no-audit @playwright/test@1.63.0
          /tmp/commercial-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test local pages and mocked contact flow without sending emails
        run: |
          mkdir -p commercial-test-results
          npm run start -- -H 127.0.0.1 -p 3100 > /tmp/commercial-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node scripts/commercial-journeys.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: commercial-journey-results
          path: commercial-test-results/
          retention-days: 5
