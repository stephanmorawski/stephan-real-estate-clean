name: Commercial journey checks
on:
  pull_request:
  push:
    branches: ['commercial/**']
permissions:
  contents: read
concurrency:
  group: commercial-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      KEYSTATIC_GITHUB_CLIENT_ID: ci-build
      KEYSTATIC_GITHUB_CLIENT_SECRET: ci-build-placeholder
      KEYSTATIC_SECRET: ci-build-placeholder-32-characters
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run build
      - name: Install an isolated browser test tool, without altering project dependencies
        run: |
          npm install --prefix /tmp/commercial-browser --no-save --ignore-scripts --no-fund --no-audit @playwright/test@1.63.0
          /tmp/commercial-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test local pages; mock contact delivery; never send email
        run: |
          mkdir -p commercial-test-results
          npm run start -- -H 127.0.0.1 -p 3100 > /tmp/commercial-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createRequire } from 'node:module';
          const { chromium, expect }=createRequire('/tmp/commercial-browser/package.json')('@playwright/test');
          const base='http://127.0.0.1:3100';
          let ready=false;
          for(let n=0;n<60;n++){try{if((await fetch(base+'/fr')).ok){ready=true;break;}}catch{} await new Promise(r=>setTimeout(r,500));}
          assert.ok(ready,'Local server must be ready');
          const browser=await chromium.launch();
          const results=[];
          const checkedLinks=new Set();
          try {
            for(const width of [1440,390]) {
              const context=await browser.newContext({viewport:{width,height:950}});
              await context.route('**/*',r=>new URL(r.request().url()).origin===base?r.continue():r.abort());
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              for(const lang of ['fr','en']) {
                for(const path of [`/${lang}`,`/${lang}/services`]) {
                  const raw=await fetch(base+path);assert.equal(raw.status,200);
                  const html=await raw.text();assert.ok(html.includes('<title>'));assert.ok(html.includes('Stephan'));
                  await page.goto(base+path);await page.waitForTimeout(300);
                  await expect(page.locator('h1')).toHaveCount(1);
                  await expect(page.locator('html')).toHaveAttribute('lang',lang);
                  await expect(page.locator('link[rel="canonical"]')).toHaveAttribute('href','https://www.cotedazuragency.com'+path);
                  await expect(page.locator('h1')).toBeVisible();
                  assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2),'No page overflow');
                  const hrefs=await page.locator('main a').evaluateAll(nodes=>nodes.map(n=>n.getAttribute('href')));
                  for(const href of hrefs){if(!href?.startsWith('/')||href.startsWith('//')||href.startsWith('/api/')||checkedLinks.has(href))continue;checkedLinks.add(href);const r=await fetch(base+href);assert.ok(r.status<400,`Broken local link ${href}: ${r.status}`);}
                  await page.screenshot({path:`commercial-test-results/${lang}-${path.endsWith('services')?'services':'home'}-${width}.png`,fullPage:true});
                  results.push({path,width,ssr:true,canonical:true,responsive:true});
                }
              }
              await page.goto(base+'/fr/services');
              await page.locator('main a[data-conversion="buyer_contact"]').click();
              await expect(page).toHaveURL(base+'/fr/contact?projet=achat');
              await expect(page.locator('h1')).toContainText('recherche');
              assert.equal(await page.locator('form').evaluate(f=>f.checkValidity()),false);
              let delivered;
              await page.route('**/api/contact',async route=>{delivered=route.request().postDataJSON();await route.fulfill({status:200,contentType:'application/json',body:'{"ok":true}'});});
              await page.locator('#contact-name').fill('Local browser test');
              await page.locator('#contact-email').fill('local-test@example.org');
              await page.locator('#contact-message').fill('Only a local mocked test. No email is sent.');
              const response=page.waitForResponse(r=>r.url().endsWith('/api/contact'));
              await page.locator('button[type="submit"]').click();await response;
              assert.ok(delivered.message.startsWith('[Achat]\n'));
              assert.equal(delivered.email,'local-test@example.org');
              assert.deepEqual(errors,[]);
              await context.close();
            }
          } finally {await browser.close();}
          fs.writeFileSync('commercial-test-results/results.json',JSON.stringify({passed:true,checks:results,links:[...checkedLinks],contact:'mocked only; no actual email'},null,2));
          console.log(JSON.stringify({passed:true,pageChecks:results.length,linksChecked:checkedLinks.size,contact:'mocked only'}));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: commercial-journey-results
          path: commercial-test-results/
          retention-days: 5
