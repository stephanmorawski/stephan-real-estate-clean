name: CAA temporary verify production QA runtime fix
on:
  push:
    branches:
      - fix/caa-postproduction-qa-timeout-20261103
    paths:
      - '.github/workflows/caa-temporary-test-production-qa-fix.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout QA-only fix
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate JavaScript syntax
        run: node --check scripts/check-production.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and browser
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate current production commit with bounded QA checks
        env:
          SITE_URL: https://www.cotedazuragency.com
          EXPECTED_SHA: 3915beab4a7f994336c50a897dfc18a541262654
        run: node scripts/check-production.mjs
      - name: Upload captures and report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caa-production-qa-runtime-fix-evidence
          path: artifacts/post-production/
          retention-days: 14
          if-no-files-found: warn
