name: CAA Garoupe v3 FR EN preview QA (draft only)
on:
  push:
    branches:
      - caa/editorial-2026-11-11-choice-2
    paths:
      - .github/workflows/caa-garoupe-v3-preview-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch SHA
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Build the exact candidate
        env:
          KEYSTATIC_GITHUB_CLIENT_ID: ci-build
          KEYSTATIC_GITHUB_CLIENT_SECRET: ci-build-placeholder
          KEYSTATIC_SECRET: ci-build-placeholder-32-characters
        run: npm run build
      - name: Serve FR EN candidate locally
        shell: bash
        run: |
          set -euo pipefail
          (npm start -- -p 3000 >/tmp/caa-garoupe-v3-server.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/fr/actualites >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/caa-garoupe-v3-server.log
          exit 1
      - name: Check both languages on desktop and mobile
        run: node scripts/check-caa-garoupe-v3.mjs
      - name: Archive screenshots, report and JPEG checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caa-garoupe-v3-qa
          path: artifacts/caa-garoupe-v3/
          retention-days: 30
          if-no-files-found: warn

