name: Prepare Biot licensed editorial photo on preview branch
on:
  push:
    branches:
      - caa/editorial/2026-10-29-biot-art-de-vivre
    paths:
      - .github/workflows/prepare-biot-photo.yml

permissions:
  contents: write

concurrency:
  group: caa-biot-photo-preview
  cancel-in-progress: false

jobs:
  materialize-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact editorial branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fetch licensed Commons photo, verify and record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/news
          target=public/news/2026-10-29-biot-place-des-arcades.jpg
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 4 --connect-timeout 15 --max-time 180 \
            --user-agent 'CoteDAzurAgencyEditorial/1.0 (Commons photo licensing)' \
            'https://upload.wikimedia.org/wikipedia/commons/6/66/BIOT_Place_des_Arcades_07.jpg' \
            --output "$target"
          test "$(file --brief --mime-type "$target")" = 'image/jpeg'
          test "$(wc -c < "$target")" -eq 4751154
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          p = Path('public/news/2026-10-29-biot-place-des-arcades.jpg')
          raw = p.read_bytes()
          assert raw[:2] == b'\xff\xd8', 'Not a JPEG'
          position = 2
          dimensions = None
          while position < len(raw) - 12:
              if raw[position] != 0xff:
                  position += 1
                  continue
              while raw[position] == 0xff:
                  position += 1
              marker = raw[position]
              position += 1
              if marker in (0xd8, 0xd9):
                  continue
              if marker in (0xda,):
                  break
              length = int.from_bytes(raw[position:position + 2], 'big')
              if marker in (0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf):
                  dimensions = (int.from_bytes(raw[position + 5:position + 7], 'big'), int.from_bytes(raw[position + 3:position + 5], 'big'))
                  break
              position += length
          assert dimensions == (4128, 3096), f'Unexpected photo size {dimensions}'
          digest = hashlib.sha256(raw).hexdigest()
          article_path = Path('content/news/2026-10-29-biot-village-art-nature.json')
          article = json.loads(article_path.read_text())
          assert article['image'] == 'https://upload.wikimedia.org/wikipedia/commons/6/66/BIOT_Place_des_Arcades_07.jpg'
          assert article['imageCredit']['author'] == 'Abxbay'
          assert article['imageCredit']['license'] == 'CC BY-SA 4.0'
          article['image'] = '/news/2026-10-29-biot-place-des-arcades.jpg'
          article_path.write_text(json.dumps(article, ensure_ascii=False, indent=2) + '\n')
          register_path = Path('content/news-drafts/2026-10-29-evergreen-proposals.json')
          register = json.loads(register_path.read_text())
          assert register['cycleId'] == 'caa-2026-10-29-evergreen'
          assert register['workflowStatus'] == 'preparing'
          register['imageValidation'].update({
              'sha256': digest,
              'sha256Status': 'verified_original_bytes',
              'bytesVerified': len(raw),
              'widthVerified': dimensions[0],
              'heightVerified': dimensions[1],
              'localPath': '/news/2026-10-29-biot-place-des-arcades.jpg',
              'browserDecode': 'pending_preview'
          })
          register['nextAction'] = 'inspect_preview_fr_en_browser_layout_then_send_approval_pack'
          register_path.write_text(json.dumps(register, ensure_ascii=False, indent=2) + '\n')
          print('JPEG validated:', dimensions, 'bytes:', len(raw), 'SHA256:', digest)
          PY

      - name: Commit licensed asset to preview branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/prepare-biot-photo.yml
          git add public/news/2026-10-29-biot-place-des-arcades.jpg \
            content/news/2026-10-29-biot-village-art-nature.json \
            content/news-drafts/2026-10-29-evergreen-proposals.json \
            .github/workflows/prepare-biot-photo.yml
          git commit -m 'feat(news): self-host original licensed Biot JPEG and verify SHA-256'
          git pull --rebase origin caa/editorial/2026-10-29-biot-art-de-vivre
          git push origin HEAD:caa/editorial/2026-10-29-biot-art-de-vivre
