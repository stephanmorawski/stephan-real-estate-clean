name: Materialize Monaco Yacht Show editorial image

on:
  push:
    paths:
      - '.github/workflows/materialize-monaco-yacht-show-image.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, validate and crop licensed Port Hercule visual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/news
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Port_Hercule_Monaco_with_yachts_and_Le_Rocher_2026.JPG?width=1600' \
            --output /tmp/port-hercule-source.jpg
          test -s /tmp/port-hercule-source.jpg
          mime="$(file --brief --mime-type /tmp/port-hercule-source.jpg)"
          test "$mime" = 'image/jpeg'
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/port-hercule-source.jpg').convert('RGB')
          w, h = src.size
          if w < 1200 or h < 675 or w <= h:
              raise SystemExit(f'Unusable source dimensions: {w}x{h}')
          ratio = 16 / 9
          if w / h > ratio:
              new_w = int(h * ratio)
              left = (w - new_w) // 2
              src = src.crop((left, 0, left + new_w, h))
          else:
              new_h = int(w / ratio)
              top = (h - new_h) // 2
              src = src.crop((0, top, w, top + new_h))
          src = src.resize((1440, 810), Image.Resampling.LANCZOS)
          out = 'public/news/2026-09-22-monaco-yacht-show-2026.jpg'
          src.save(out, 'JPEG', quality=86, optimize=True, progressive=True)
          check = Image.open(out)
          assert check.size == (1440, 810)
          print(f'validated {out}: {check.size[0]}x{check.size[1]}')
          PY

      - name: Commit visual to editorial branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/news/2026-09-22-monaco-yacht-show-2026.jpg
          if git diff --cached --quiet; then
            echo 'Image already materialized; nothing to commit.'
            exit 0
          fi
          git commit -m 'content: materialize Monaco Yacht Show editorial visual'
          git push origin HEAD:"${GITHUB_REF_NAME}"
