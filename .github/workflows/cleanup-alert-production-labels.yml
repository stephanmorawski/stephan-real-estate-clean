name: Cleanup production alert labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-alert-production-labels.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Remove preview-only labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/AlertPreview.jsx')
          text = path.read_text(encoding='utf-8')

          badge = '''          <span className="border border-[#d6b985] px-3 py-2 text-[10px] font-semibold uppercase tracking-widest text-[#8b724a]">
            {fr ? 'Maquette · sans inscription' : 'Preview · no sign-up'}
          </span>
'''
          footer = '''            <div className="flex items-center bg-[#14232b] px-5 py-4 text-[10px] uppercase tracking-[.12em] text-[#bdc8c8]">
              {fr ? 'Service en prévisualisation' : 'Service preview'}
            </div>
'''

          if badge not in text:
              raise SystemExit('Expected preview badge not found')
          if footer not in text:
              raise SystemExit('Expected preview footer not found')

          text = text.replace(badge, '', 1)
          text = text.replace(
              'className="grid gap-px bg-[#607078] text-white md:grid-cols-[1fr_1fr_1fr_auto]"',
              'className="grid gap-px bg-[#607078] text-white md:grid-cols-3"',
              1,
          )
          text = text.replace(footer, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate build
        run: npm ci && npm run build

      - name: Commit cleanup and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-alert-production-labels.yml
          git config user.name "caa-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/AlertPreview.jsx .github/workflows/cleanup-alert-production-labels.yml
          git commit -m "fix: remove preview labels from production alert section"
          git push origin HEAD:main
