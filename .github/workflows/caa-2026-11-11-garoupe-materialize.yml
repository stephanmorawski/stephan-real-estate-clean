name: CAA materialize licensed Garoupe archive visual (review branch only)
on:
  push:
    branches: [caa/editorial-2026-11-11-choice-2]
    paths:
      - '.github/workflows/caa-2026-11-11-garoupe-materialize.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download the licensed original
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 \
            --user-agent 'CoteDAzurAgency-CaaEditorialReview/1.0' \
            'https://upload.wikimedia.org/wikipedia/commons/2/26/Plage_de_la_garoupe_01.jpg' \
            --output /tmp/garoupe-archive-original.jpg
          test -s /tmp/garoupe-archive-original.jpg
          file --mime-type /tmp/garoupe-archive-original.jpg
      - name: Resize without cropping, decode, record SHA256 and credit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image,ImageOps
          import hashlib,json,os
          from pathlib import Path
          original=Path('/tmp/garoupe-archive-original.jpg')
          with Image.open(original) as src:
              src.verify()
          with Image.open(original) as src:
              img=ImageOps.exif_transpose(src).convert('RGB')
              assert img.size == (3096,4128), f'unexpected original size: {img.size}'
              img.thumbnail((720,960),Image.Resampling.LANCZOS)
              assert img.size == (720,960), f'unexpected dimensions: {img.size}'
              output=Path('public/news/2026-11-11-antibes-garoupe-abxbay.jpg')
              output.parent.mkdir(parents=True,exist_ok=True)
              img.save(output,format='JPEG',quality=84,optimize=True,subsampling=0)
          with Image.open(output) as im:
              assert im.format == 'JPEG' and im.size == (720,960)
              im.load()
          content=output.read_bytes()
          assert content[:2] == bytes.fromhex('ffd8') and content[-2:] == bytes.fromhex('ffd9')
          assert 10000 < len(content) < 1000000
          digest=hashlib.sha256(content).hexdigest()
          registry_path=Path('content/news-drafts/2026-11-11-editorial-proposals.json')
          record=json.loads(registry_path.read_text(encoding='utf-8'))
          assert record['cycleId']=='caa-2026-11-11-editorial' and record['version']==2
          assert record['selectedChoice']==2 and record['workflowStatus']=='preparing'
          assert record['publicationAuthorized'] is False
          asset=record['selectedArticle']['visual']
          assert asset['sourceUrl']=='https://commons.wikimedia.org/wiki/File:Plage_de_la_garoupe_01.jpg'
          asset.update(status='materialized_verified',assetMime='image/jpeg',assetBytes=len(content),
              assetWidth=720,assetHeight=960,assetSha256=digest,decodedWithPillow=True,
              originalFile='Plage_de_la_garoupe_01.jpg',archiveDate='2023-03-10')
          record['visualPrepared']=True
          registry_path.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'asset':str(output),'mime':'image/jpeg','bytes':len(content),'width':720,'height':960,'sha256':digest,'license':asset['license']},indent=2))
          PY
      - name: Save the licensed photo only on the review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/news/2026-11-11-antibes-garoupe-abxbay.jpg content/news-drafts/2026-11-11-editorial-proposals.json
          if git diff --cached --quiet; then echo 'Already materialized'; exit 0; fi
          git commit -m 'CAA: materialize credited La Garoupe archival JPEG and checksum (review only)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
